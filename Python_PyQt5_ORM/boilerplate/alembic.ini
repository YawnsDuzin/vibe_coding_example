# === Alembic 설정 파일 ===
# Alembic은 데이터베이스 구조(스키마) 변경을 버전별로 관리하는 도구입니다.
# Git이 코드 변경을 관리하듯, Alembic은 DB 테이블 변경을 관리합니다.

[alembic]
# 마이그레이션 스크립트가 저장되는 디렉토리
script_location = alembic

# DB 연결 URL — 실제로는 env.py에서 .env 파일의 값을 사용합니다
# 이 값은 env.py에서 덮어씌워지므로 placeholder입니다
sqlalchemy.url = sqlite:///data/app.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
